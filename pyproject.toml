[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "python-addons"
version = "0.1.0"
description = "Foundational Python value types with explicit algebraic contracts"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "pylint",
    "pyright",
    "pytest",
]

[tool.uv.build-backend]
module-name = "addons"
module-root = "src"

[tool.pyright]
include = [
    "src",
    "tests",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
