[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[project]
name = "python-addons"
version = "0.1.0"
description = "Foundational Python value types with explicit algebraic contracts"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "pylint",
    "pyright",
    "pytest",
]

[tool.uv.build-backend]
module-name = "addons"
module-root = "src"

[tool.pyright]
reportIncompatibleMethodOverride = "none"
venvPath = "."
venv = ".venv"
include = [
    "src",
    "tests",
]

[tool.pylint.format]
max-line-length = 132
indent-string = "\t"

[tool.pylint."messages control"]
#	Errors and fatals only, matching the editor: conventions, refactors and warnings here are
#	house style (tabs, long operator tables, deep contract stacks), not findings.
disable = [
    "C",
    "R",
    "W",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
